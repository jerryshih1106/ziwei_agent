services:
  - type: web
    name: ziwei-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RAG_MODE
        value: matching
      - key: LLM_MODEL
        value: gemini-2.5-flash-lite
      - key: ALLOW_REGISTER
        value: "false"
      - key: GOOGLE_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: LINE_ACCESS_KEY
        sync: false
      - key: LINE_SECRET
        sync: false
      - key: LINE_BOT_ID
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIMS_EMAIL
        sync: false
