services:
  - type: web
    name: ziwei-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    volumes:
      - /data
    envVars:
      - key: DATA_DIR
        value: /data
      - key: RAG_MODE
        value: matching
      - key: LLM_MODEL
        value: gemini-2.5-flash-lite
      - key: ALLOW_REGISTER
        value: "false"
      - key: GOOGLE_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: LINE_ACCESS_KEY
        sync: false
      - key: LINE_SECRET
        sync: false
      - key: LINE_BOT_ID
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIMS_EMAIL
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
