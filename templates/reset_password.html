<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>重置密碼 — 紫微AI命理</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #060e1c 0%, #0d1f3c 100%);
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #e8dcc8;
  }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(201,162,39,0.2);
    border-radius: 16px;
    padding: 40px 32px;
    width: 100%;
    max-width: 420px;
    backdrop-filter: blur(10px);
  }
  .logo {
    text-align: center;
    margin-bottom: 28px;
  }
  .logo h1 { color: #c9a227; font-size: 1.4rem; font-weight: 700; }
  .logo p { color: #8a9bb0; font-size: 0.85rem; margin-top: 4px; }
  h2 { font-size: 1.1rem; margin-bottom: 20px; color: #e8dcc8; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 0.85rem; color: #8a9bb0; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 12px 14px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    color: #e8dcc8;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: #c9a227; }
  .btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #c9a227, #a0801d);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    min-height: 48px;
  }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg {
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.9rem;
    display: none;
  }
  .msg.error { background: rgba(220,53,69,0.15); border: 1px solid rgba(220,53,69,0.3); color: #ff7b7b; }
  .msg.success { background: rgba(40,167,69,0.15); border: 1px solid rgba(40,167,69,0.3); color: #7bffaa; }
  .back-link { display: block; text-align: center; margin-top: 20px; color: #8a9bb0; font-size: 0.85rem; text-decoration: none; }
  .back-link:hover { color: #c9a227; }
  .rules { font-size: 0.8rem; color: #8a9bb0; margin-top: 6px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>☆ 紫微AI命理</h1>
    <p>重置您的密碼</p>
  </div>

  <div id="form-section">
    <h2>設定新密碼</h2>
    <form id="reset-form" onsubmit="submitReset(event)">
      <div class="field">
        <label for="new-password">新密碼</label>
        <input type="password" id="new-password" placeholder="請輸入新密碼（至少6個字元）" autocomplete="new-password" required minlength="6">
        <p class="rules">密碼至少 6 個字元</p>
      </div>
      <div class="field">
        <label for="confirm-password">確認新密碼</label>
        <input type="password" id="confirm-password" placeholder="再次輸入新密碼" autocomplete="new-password" required minlength="6">
      </div>
      <button type="submit" class="btn" id="submit-btn">重置密碼</button>
    </form>
    <div id="msg" class="msg"></div>
  </div>

  <div id="success-section" style="display:none;text-align:center">
    <p style="font-size:2rem;margin-bottom:12px">✅</p>
    <h2>密碼已成功重置</h2>
    <p style="color:#8a9bb0;margin-top:8px;font-size:0.9rem">請使用新密碼登入</p>
    <a href="/chat" class="btn" style="display:block;margin-top:24px;text-decoration:none;text-align:center">前往登入</a>
  </div>

  <a href="/chat" class="back-link">← 返回主頁</a>
</div>

<script>
const params = new URLSearchParams(location.search);
const TOKEN = params.get('token') || '';

if (!TOKEN) {
  document.getElementById('msg').textContent = '⚠️ 無效的重置連結，請重新申請密碼重置。';
  document.getElementById('msg').className = 'msg error';
  document.getElementById('msg').style.display = 'block';
  document.getElementById('submit-btn').disabled = true;
}

async function submitReset(e) {
  e.preventDefault();
  const pw = document.getElementById('new-password').value;
  const confirm = document.getElementById('confirm-password').value;
  const msgEl = document.getElementById('msg');
  const btn = document.getElementById('submit-btn');

  if (pw !== confirm) {
    msgEl.textContent = '兩次密碼輸入不一致';
    msgEl.className = 'msg error';
    msgEl.style.display = 'block';
    return;
  }
  btn.disabled = true;
  btn.textContent = '處理中…';
  msgEl.style.display = 'none';

  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN, new_password: pw }),
    });
    const data = await res.json();
    if (res.ok) {
      document.getElementById('form-section').style.display = 'none';
      document.getElementById('success-section').style.display = 'block';
    } else {
      msgEl.textContent = data.detail || '重置失敗，請重新申請';
      msgEl.className = 'msg error';
      msgEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = '重置密碼';
    }
  } catch {
    msgEl.textContent = '網路錯誤，請稍後再試';
    msgEl.className = 'msg error';
    msgEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = '重置密碼';
  }
}
</script>
</body>
</html>
